<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Chatbot Hát Xoan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 80vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .chat-header p { font-size: 0.9rem; opacity: 0.9; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }
        .message {
            margin-bottom: 15px;
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            background: #4f46e5;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .typing {
            font-style: italic;
            color: #64748b;
        }
        .chat-input {
            display: flex;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input input:focus { border-color: #4f46e5; }
        .chat-input button {
            padding: 12px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input button:hover { background: #4338ca; }
        .chat-input button:disabled { background: #94a3b8; cursor: not-allowed; }
        .suggestions {
            padding: 10px 20px;
            background: #f1f5f9;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .suggestion-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .suggestion-btn:hover { background: #4f46e5; color: white; border-color: #4f46e5; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chatbot Hát Xoan Phú Thọ</h1>
            <p>Demo trợ lý AI RAG - Module 3</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Xin chào! Tôi là trợ lý Hát Xoan. Hãy đặt câu hỏi về di sản Hát Xoan Phú Thọ.
            </div>
        </div>
        <div class="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Hát Xoan là gì?</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Hát Xoan có mấy chặng?</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Điệu Giáo Trống là gì?</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Phường Xoan gồm những ai?</button>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Nhập câu hỏi..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/chat';
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendTyping() {
            const div = document.createElement('div');
            div.className = 'message bot-message typing';
            div.id = 'typingIndicator';
            div.textContent = 'Đang suy nghĩ...';
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            appendMessage(query, true);
            userInput.value = '';
            sendBtn.disabled = true;
            appendTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                removeTyping();

                if (!response.ok) {
                    appendMessage(`Lỗi server: ${response.status}`, false);
                    return;
                }

                const data = await response.json();
                appendMessage(data.answer, false);
            } catch (error) {
                removeTyping();
                appendMessage('Không thể kết nối đến server. Vui lòng kiểm tra server đã chạy chưa.', false);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function sendSuggestion(button) {
            userInput.value = button.textContent;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
